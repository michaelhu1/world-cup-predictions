[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-predictions"
version = "0.1.0"
description = "2026 FIFA World Cup match outcome predictor: data ingestion + match simulation."
requires-python = ">=3.10"
authors = [{ name = "SuperXingKong", email = "1912003473@qq.com" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tqdm>=4.66",
    "pydantic>=2.5",
    "click>=8.1",
    "python-dateutil>=2.8",
    "tenacity>=8.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
sim = [
    "scipy>=1.12",
    "scikit-learn>=1.4",
]
events = [
    # StatsBomb-open + socceraction stack for player VAEP/xG priors used
    # by the scorer-allocation head (see docs/architecture.md).
    "statsbombpy>=1.12",
    "socceraction>=1.5",
]
bayes = [
    "pymc>=5.10",
    "arviz>=0.17",
]
notebook = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
wcp = "wcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
